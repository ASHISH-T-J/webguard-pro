[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webguard-pro"
version = "3.0.0"
description = "Async web recon, vulnerability detection (signature + differential + ML anomaly) and bug bounty / red-team workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["numpy>=1.26", "scikit-learn>=1.4"]
dns = ["dnspython>=2.6"]
socks = ["httpx[socks]>=0.27"]
llm = ["anthropic>=2.4"]
browser = ["playwright>=1.40"]
tls = ["cryptography>=42"]
all = ["numpy>=1.26", "scikit-learn>=1.4", "dnspython>=2.6", "httpx[socks]>=0.27", "anthropic>=2.4", "playwright>=1.40",
       "cryptography>=42"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
webguard = "webguard.cli:main"

[tool.setuptools.packages.find]
include = ["webguard*"]

[tool.setuptools.package-data]
webguard = ["data/*.txt", "data/signatures/*.json", "data/wordlists/*.txt", "data/cve/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "B008", "UP007", "B905"]
