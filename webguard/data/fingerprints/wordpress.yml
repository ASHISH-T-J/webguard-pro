# Generated from data/cve/wordpress_plugins.yml: run only after WordPress is detected.
- id: wp-plugin-backup-backup
  product: wp-plugin:backup-backup
  requires:
  - wordpress
  http:
  - path:
    - /wp-content/plugins/backup-backup/readme.txt
    matchers:
    - type: regex
      regex:
      - (?i)^\s*(?:Stable tag|Version):\s*\d
    extractors:
    - regex:
      - (?im)^\s*Stable tag:\s*([\d.]+)
      - (?im)^\s*Version:\s*([\d.]+)
