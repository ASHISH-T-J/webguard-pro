# HTTP fingerprints: product + version from public pages, headers and version endpoints (identification only).
- {id: jenkins, product: jenkins, http: [{path: ["/"], matchers: [{type: header, name: x-jenkins}], extractors: [{type: header, name: x-jenkins, regex: '([\d.]+)'}]}]}
